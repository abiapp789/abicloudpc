name: PC (RustDesk Streamer)

on:
  workflow_dispatch:

jobs:
  rustdesk-pc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Disable Display Sleep & Screen Lock
        run: |
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

      - name: Install RustDesk
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.0/rustdesk-1.3.0-x86_64.exe"
          $exe = "$env:TEMP\rustdesk.exe"
          
          Invoke-WebRequest -Uri $url -OutFile $exe
          
          # Install RustDesk Service
          Start-Process $exe -ArgumentList "--silent-install" -Wait
          
          # Allow RustDesk through Windows Firewall
          New-NetFirewallRule -DisplayName "RustDesk" -Direction Inbound -Program "C:\Program Files\RustDesk\rustdesk.exe" -Action Allow -ErrorAction SilentlyContinue

      - name: Configure RustDesk Password & Fetch ID
        run: |
          $rustDeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          
          # Get password from repository secret or default to 123456
          $password = "${{ secrets.RUSTDESK_PASSWORD }}"
          if (-not $password) { $password = "123456" }
          
          # Set static password in RustDesk service
          & $rustDeskExe --password $password
          
          # Wait for RustDesk service to initialize and register ID
          $rustdeskId = ""
          for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 3
              $rustdeskId = (& $rustDeskExe --get-id).Trim()
              if ($rustdeskId -and $rustdeskId -match "^\d+$") {
                  break
              }
          }

          if (-not $rustdeskId) {
              Write-Error "Failed to retrieve RustDesk ID."
              exit 1
          }

          Write-Host "`n======================================================="
          Write-Host "RUSTDESK ACCESS (ZERO BLACK SCREEN RISK)"
          Write-Host "RustDesk ID : $rustdeskId"
          Write-Host "Password    : [PROTECTED BY RUSTDESK_PASSWORD SECRET]"
          Write-Host "=======================================================\n"

          # Store ID in log context for easy reference
          echo "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV

      - name: Maintain Active Runner Loop
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RustDesk Active - Stream is live continuously!"
              Start-Sleep -Seconds 300
          }
