name: PC

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP & Power Settings
        run: |
          # Enable Remote Desktop safely
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          # Allow RDP through Windows Firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Disable monitor timeouts and power savings (Prevents stream freezes)
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          # Restart Remote Desktop Service
          Restart-Service -Name TermService -Force

      - name: Create RDP User & Set Policy Retention
        run: |
          $userName = "Abi Cloud PC"
          $password = "${{ secrets.RDP_PASSWORD }}"
          
          # Mask password in GitHub Actions runner logs
          Write-Host "::add-mask::$password"
          
          # 1. Disable local Windows password complexity requirements
          net accounts /minpwlen:0
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY
          
          # 2. Create User using Repository Secret
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $userName
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $userName
          
          # 3. Add Registry Keys to prevent disconnect / logoff termination
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fResetBroken" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fReconnectSame" -Value 1 -Force

          # 4. Disable Lock Screen on Disconnect
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

          # 5. Apply Group Policies for infinite session duration
          $tsPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPath -Name "MaxIdleTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "RemoteAppLogoffTimeout" -Value 0 -Type DWord -Force

      - name: Install Virtual Display Driver (Fixes Black Screen on Live Stream)
        run: |
          # Download and install Amyuni Virtual Display Driver to keep active display canvas in headless mode
          $driverUrl = "https://www.amyuni.com/downloads/usbmmidd_v2.zip"
          $driverZip = "$env:TEMP\usbmmidd.zip"
          $driverDir = "C:\VirtualDisplay"
          
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          Invoke-WebRequest -Uri $driverUrl -OutFile $driverZip
          Expand-Archive -Path $driverZip -DestinationPath $driverDir -Force
          
          # Enable Virtual Monitor
          Set-Location $driverDir
          .\deviceinstaller64.exe enableidd 1
          
          # Force Windows registry to keep 1080p rendering active for headless session
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name "AutoAdminLogon" -Value "0" -Force

      - name: Install System-Level Console Redirector
        run: |
          # Script that attaches disconnected RDP sessions directly to local virtual console
          $scriptContent = @"
          while (`$true) {
              `$sessions = qwinsta
              foreach (`$line in `$sessions) {
                  if (`$line -match "Disc" -and `$line -match "(\d+)") {
                      `$sessionId = `$matches[1]
                      tscon `$sessionId /dest:console /a 2>`$null
                  }
              }
              Start-Sleep -Seconds 3
          }
          "@
          
          $scriptPath = "C:\KeepLiveAlive.ps1"
          $scriptContent | Out-File -FilePath $scriptPath -Encoding utf8

          # Register as a SYSTEM Scheduled Task (Runs with full OS privileges even when user disconnects)
          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File $scriptPath"
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
          
          Register-ScheduledTask -TaskName "KeepLiveAlive" -Action $action -Trigger $trigger -Principal $principal -Force
          Start-ScheduledTask -TaskName "KeepLiveAlive"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          # Wait until Tailscale binary is installed
          while (-not (Test-Path $tsExe)) { Start-Sleep -Seconds 2 }

          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for IP allocation
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment timed out."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Maintain Active Runner Loop
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: Abi Cloud PC"
          Write-Host "Password: [HIDDEN BY GITHUB LOG MASKING]"
          Write-Host "==================`n"

          # Keep runner active indefinitely
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active & Virtual Display Active..."
              Start-Sleep -Seconds 300
          }
