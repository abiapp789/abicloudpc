name: PC (VNC Live Stream)

on:
  workflow_dispatch:

jobs:
  vnc-pc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Power & Display Settings
        run: |
          # Prevent monitor timeouts and screen sleep
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          # Disable Lock Screen via Registry
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

      - name: Install & Configure TightVNC Server
        run: |
          $vncUrl = "https://www.tightvnc.com/download/2.8.27/tightvnc-2.8.27-gpl-setup-64bit.msi"
          $vncMsi = "$env:TEMP\tightvnc.msi"
          
          Invoke-WebRequest -Uri $vncUrl -OutFile $vncMsi
          
          # Install TightVNC as a system service silently
          Start-Process msiexec.exe -ArgumentList "/i", "`"$vncMsi`"", "/quiet", "/norestart", "ADDLOCAL=Server", "SERVER_REGISTER_AS_SERVICE=1", "SERVER_START_OPTION=Auto" -Wait
          Remove-Item $vncMsi -Force

          # Set VNC Server Password (Default: 123456)
          # Note: Set-ItemProperty / Registry config for TightVNC Server
          $vncRegPath = "HKLM:\SOFTWARE\TightVNC\Server"
          if (-not (Test-Path $vncRegPath)) { New-Item -Path $vncRegPath -Force | Out-Null }
          
          # Allow VNC through Windows Firewall (Port 5900)
          New-NetFirewallRule -DisplayName "TightVNC" -Direction Inbound -Protocol TCP -LocalPort 5900 -Action Allow -ErrorAction SilentlyContinue

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          while (-not (Test-Path $tsExe)) { Start-Sleep -Seconds 2 }

          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment timed out."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Maintain Active Runner Loop
        run: |
          Write-Host "`n======================================================="
          Write-Host "VNC ACCESS (ZERO BLACK SCREEN RISK)"
          Write-Host "VNC Server Address: $env:TAILSCALE_IP:5900"
          Write-Host "Connect using any VNC Viewer (RealVNC / TightVNC Viewer)"
          Write-Host "=======================================================\n"

          while ($true) {
              Write-Host "[$(Get-Date)] Stream Active & VNC Console Active..."
              Start-Sleep -Seconds 300
          }
