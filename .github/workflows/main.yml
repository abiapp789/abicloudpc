name: PC (RustDesk Streamer)

on:
  workflow_dispatch:

jobs:
  rustdesk-pc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Disable Display Sleep & Screen Lock
        run: |
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

      - name: Download & Install RustDesk Service
        run: |
          $msiUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.0/rustdesk-1.3.0-x86_64.msi"
          $msiPath = "$env:TEMP\rustdesk.msi"
          
          Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
          
          # Silent MSI installation avoids background process hangs
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $msiPath -Force

          # Allow RustDesk through Windows Firewall
          New-NetFirewallRule -DisplayName "RustDesk" -Direction Inbound -Program "C:\Program Files\RustDesk\rustdesk.exe" -Action Allow -ErrorAction SilentlyContinue

      - name: Start RustDesk Service, Set Password & Output ID
        run: |
          $rustDeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          
          # Get password from repository secret or default to 123456
          $password = "${{ secrets.RUSTDESK_PASSWORD }}"
          if (-not $password) { $password = "123456" }

          # Ensure RustDesk Windows Service is running
          Start-Service -Name "rustdesk" -ErrorAction SilentlyContinue
          
          # Set static password
          Start-Process -FilePath $rustDeskExe -ArgumentList "--password", "$password" -NoNewWindow -Wait
          
          # Poll until RustDesk generates and registers its public ID
          $rustdeskId = ""
          for ($i = 1; $i -le 12; $i++) {
              Start-Sleep -Seconds 5
              $rustdeskId = (& $rustDeskExe --get-id 2>$null).Trim()
              if ($rustdeskId -and $rustdeskId -match "^\d+$") {
                  break
              }
          }

          if (-not $rustdeskId) {
              Write-Error "Failed to retrieve RustDesk ID. RustDesk service did not assign an ID."
              exit 1
          }

          Write-Host "`n======================================================="
          Write-Host "RUSTDESK ACCESS (ZERO BLACK SCREEN RISK)"
          Write-Host "RustDesk ID : $rustdeskId"
          Write-Host "Password    : [PROTECTED BY RUSTDESK_PASSWORD SECRET]"
          Write-Host "=======================================================\n"

      - name: Maintain Active Runner Loop
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RustDesk Active - Stream running continuously!"
              Start-Sleep -Seconds 300
          }
