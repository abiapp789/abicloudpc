name: PC (Chrome Remote Desktop)

on:
  workflow_dispatch:

jobs:
  crd-pc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Disable Power Off & Screen Saver
        run: |
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

      - name: Install Chrome & Chrome Remote Desktop Host
        run: |
          # Download and install CRD Host
          $crdUrl = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
          $crdMsi = "$env:TEMP\chromeremotedesktophost.msi"

          Invoke-WebRequest -Uri $crdUrl -OutFile $crdMsi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$crdMsi`"", "/quiet", "/norestart" -Wait
          Remove-Item $crdMsi -Force -ErrorAction SilentlyContinue

          # Install Standalone Google Chrome Browser
          $chromeUrl = "https://dl.google.com/chrome/install/standalonesetup64.exe"
          $chromeExe = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $chromeExe -UseBasicParsing
          Start-Process $chromeExe -ArgumentList "/silent", "/install" -Wait
          Remove-Item $chromeExe -Force -ErrorAction SilentlyContinue

      - name: Register & Start Chrome Remote Desktop
        env:
          RAW_CRD_COMMAND: ${{ secrets.CRD_CODE }}
          CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          $pin = $env:CRD_PIN
          if (-not $pin) { $pin = "123456" }

          $rawCmd = $env:RAW_CRD_COMMAND
          if (-not $rawCmd) {
              Write-Error "CRD_CODE secret is missing!"
              exit 1
          }

          # Locate remotedesktop_host.exe directly on disk
          $hostExe = "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop\CurrentVersion\remotedesktop_host.exe"
          if (-not (Test-Path $hostExe)) {
              $hostExe = "${env:ProgramFiles}\Google\Chrome Remote Desktop\CurrentVersion\remotedesktop_host.exe"
          }

          # Extract parameters from the raw Google command string
          $codeMatch = [regex]::Match($rawCmd, '--code="?([^"\s]+)"?')
          $redirectMatch = [regex]::Match($rawCmd, '--redirect-url="?([^"\s]+)"?')
          $nameMatch = [regex]::Match($rawCmd, '--name="?([^"\s]+)"?')

          if ($codeMatch.Success) {
              $code = $codeMatch.Groups[1].Value
              $redirectUrl = if ($redirectMatch.Success) { $redirectMatch.Groups[1].Value } else { "https://remotedesktop.google.com/_/oauthredirect" }
              $name = if ($nameMatch.Success) { $nameMatch.Groups[1].Value } else { $env:COMPUTERNAME }

              Write-Host "Registering Chrome Remote Desktop Host using direct executable..."
              & $hostExe --svc-install-interactive
              & $hostExe --start --code="$code" --redirect-url="$redirectUrl" --name="$name" --pin="$pin"
          } else {
              # Fallback: sanitize string and execute directly
              Write-Host "Executing sanitized command fallback..."
              $cleanCmd = $rawCmd -replace '^&\s*', '' -replace '`', ''
              Invoke-Expression "$cleanCmd --pin=$pin"
          }

      - name: Maintain Active Runner Loop
        run: |
          Write-Host "`n======================================================="
          Write-Host "Chrome Remote Desktop Active!"
          Write-Host "Connect at: https://remotedesktop.google.com/access"
          Write-Host "=======================================================\n"

          while ($true) {
              Write-Host "[$(Get-Date)] CRD Active - Zero Black Screen Risk!"
              Start-Sleep -Seconds 300
          }
