name: PC

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP & Display Buffers
        run: |
          # 1. Enable RDP & Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # 2. Force Remote Desktop to keep active display buffer rendered
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxInstanceCount" -Value 100 -Force
          
          # 3. Prevent power down or screen timeout
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0

          # 4. Restart TermService
          Restart-Service -Name TermService -Force

      - name: Create RDP User & Security Policies
        run: |
          $userName = "Abi Cloud PC"
          $password = "${{ secrets.RDP_PASSWORD }}"
          if (-not $password) { $password = "123456" }
          
          Write-Host "::add-mask::$password"
          
          # Disable local password complexity
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          $cfgContent = Get-Content "$env:TEMP\secpol.cfg"
          $cfgContent = $cfgContent -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
          $cfgContent = $cfgContent -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
          $cfgContent | Out-File -Encoding ascii "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY
          
          # Create Account
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          net user "$userName" "$password"
          
          Add-LocalGroupMember -Group "Administrators" -Member $userName -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $userName -ErrorAction SilentlyContinue

          # Infinite session duration & disable lock screen
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

          $tsPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPath -Name "MaxIdleTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "RemoteAppLogoffTimeout" -Value 0 -Type DWord -Force

      - name: Install Virtual Driver & Set Active Resolution
        run: |
          $driverUrl = "https://www.amyuni.com/downloads/usbmmidd_v2.zip"
          $driverZip = "$env:TEMP\usbmmidd.zip"
          $driverDir = "C:\VirtualDisplay"
          
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          Invoke-WebRequest -Uri $driverUrl -OutFile $driverZip -UseBasicParsing
          Expand-Archive -Path $driverZip -DestinationPath $driverDir -Force
          
          $installer = Get-ChildItem -Path $driverDir -Recurse -Filter "deviceinstaller64.exe" | Select-Object -First 1
          if ($installer) {
              Set-Location $installer.DirectoryName
              & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd
              & .\deviceinstaller64.exe enableidd 1
          }

      - name: Configure Direct Console Auto-Loop (Fixes Close Black Screen)
        run: |
          # Re-attaches to console ONLY when an RDP session becomes disconnected
          $scriptContent = @'
          while ($true) {
              $output = qwinsta
              foreach ($line in $output) {
                  if ($line -match "disc\s+(\d+)") {
                      $sessionId = $matches[1]
                      if ($sessionId -ne "0") {
                          cmd.exe /c "tscon $sessionId /dest:console" 2>$null
                      }
                  }
              }
              Start-Sleep -Seconds 5
          }
          '@

          $scriptPath = "C:\KeepScreenAlive.ps1"
          $scriptContent | Out-File -FilePath $scriptPath -Encoding utf8

          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File $scriptPath"
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
          
          Register-ScheduledTask -TaskName "KeepScreenAliveTask" -Action $action -Trigger $trigger -Principal $principal -Force
          Start-ScheduledTask -TaskName "KeepScreenAliveTask"

      - name: Install & Connect Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          # Force TLS 1.2 download
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing

          # Headless silent MSI installation
          $process = Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/qn", "/norestart" -Wait -PassThru
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          # Explicit binary path resolution (default Tailscale installation path)
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          
          # Poll until the executable is available on disk
          $timeout = 0
          while (-not (Test-Path $tsExe) -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout += 2
          }

          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale executable was not found at $tsExe after installation."
              exit 1
          }

          # Ensure the Tailscale service is running
          Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          # Connect Tailscale non-interactively
          & "$tsExe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended

          # Poll for Tailscale IPv4 address
          $tsIP = ""
          for ($i = 1; $i -le 15; $i++) {
              $tsIP = (& "$tsExe" ip -4 2>$null).Trim()
              if ($tsIP -and $tsIP -match "^\d+\.\d+\.\d+\.\d+$") { break }
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment timed out. Check if TAILSCALE_AUTH_KEY is valid and reusable."
              exit 1
          }

          Write-Host "Tailscale IP assigned successfully: $tsIP"
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Maintain Active Runner Loop
        run: |
          Write-Host "`n======================================================="
          Write-Host "RDP ACCESS READY"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : Abi Cloud PC"
          Write-Host "Password : [PROTECTED BY RDP_PASSWORD SECRET]"
          Write-Host "=======================================================\n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP & Virtual Engine Active..."
              Start-Sleep -Seconds 300
          }
